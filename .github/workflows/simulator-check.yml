name: Simulator private preview checks
on:
  pull_request:
    paths: ['simulator/**', '.github/workflows/simulator-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/core.test.mjs
      - name: Build and self-host pinned face SDK and model
        run: node scripts/build.mjs
      - name: Browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Real WebGL and MediaPipe browser smoke tests
        run: node tests/browser.mjs
      - name: Technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aestyve-technical-evidence
          path: simulator/qa-results/
          retention-days: 7
      - name: Deployment files (only when tests pass)
        uses: actions/upload-artifact@v4
        with:
          name: aestyve-private-preview-site
          path: simulator/dist/
          retention-days: 7
      - name: Source handoff (no fonts or photos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aestyve-source-handoff
          path: |
            simulator/*.js
            simulator/*.css
            simulator/*.html
            simulator/*.json
            simulator/*.md
            simulator/scripts/
            simulator/tests/
          retention-days: 7
