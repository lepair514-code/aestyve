<!doctype html><meta charset="utf-8"><title>Layout review</title><style>body{margin:12px;font:14px Arial;background:#d8d8df}label,button{margin-right:12px}iframe{display:block;border:0;margin-top:12px;background:white}pre{white-space:pre-wrap;max-width:1300px}#status{font-weight:bold}</style><label>Page <select id="page"><option>/index.html</option><option>/en/index.html</option><option>/zh/index.html</option><option>/product-revibe.html</option><option>/en/product-revibe.html</option><option>/zh/product-revibe.html</option><option>/product-pcl.html</option><option>/en/product-pcl.html</option><option>/zh/product-pcl.html</option></select></label><label>Width <input id="width" value="1440" size="5"></label><label>Height <input id="height" value="680" size="5"></label><button id="show">Show viewport</button><button id="run">Run layout checks</button><p id="status">Ready</p><iframe id="review" title="Website viewport"></iframe><pre id="results"></pre><script>
const frame=document.querySelector('iframe'), status=document.querySelector('#status'),results=document.querySelector('#results');
async function load(page,w,h){frame.style.width=w+'px';frame.style.height=h+'px';await new Promise(resolve=>{frame.onload=resolve;frame.src=page});await frame.contentDocument.fonts.ready;await new Promise(resolve=>setTimeout(resolve,350))}
function measure(page,w,h){const d=frame.contentDocument;const rect=s=>d.querySelector(s)?.getBoundingClientRect();const a=rect('.ae-room-heading'),b=rect('.ae-room-info'),c=rect('.ae-room-bottom');const groups=d.querySelectorAll('header .lang-switch-group');const errors=[];if(a&&b&&b.top<a.bottom+20)errors.push('Intro/product overlap');if(b&&c&&c.top<b.bottom+20)errors.push('Product/controls overlap');if(groups.length!==1)errors.push('Language group count '+groups.length);if(d.documentElement.scrollWidth>d.documentElement.clientWidth+1)errors.push('Horizontal overflow');const links=[...d.querySelectorAll('header nav a')].filter(e=>e.getBoundingClientRect().width);for(let i=1;i<links.length;i++){const x=links[i-1].getBoundingClientRect(),y=links[i].getBoundingClientRect();if(x.left<y.right&&x.right>y.left+1&&x.top<y.bottom&&x.bottom>y.top+1)errors.push('Nav link overlap')};return{page,w,h,gap:a?Math.round(b.top-a.bottom):null,controlGap:b?Math.round(c.top-b.bottom):null,errors}}
document.querySelector('#show').onclick=async()=>{const p=document.querySelector('#page').value,w=+document.querySelector('#width').value,h=+document.querySelector('#height').value;await load(p,w,h);status.textContent=JSON.stringify(measure(p,w,h))};
document.querySelector('#run').onclick=async()=>{results.textContent='';let count=0,failed=0;for(const page of [...document.querySelector('#page').options].map(x=>x.value)){const sizes=page.endsWith('index.html')?[[320,640],[390,844],[768,680],[1024,640],[1280,680],[1440,680],[1920,1080]]:[[390,844],[1024,640],[1440,680]];for(const [w,h] of sizes){status.textContent='Checking '+page+' '+w+' × '+h;await load(page,w,h);const r=measure(page,w,h);count++;failed+=r.errors.length>0;results.textContent+=JSON.stringify(r)+'\n'}}status.textContent='Complete: '+count+' views; '+failed+' flagged'};
</script>
