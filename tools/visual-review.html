<!doctype html><html><head><meta charset="utf-8"><title>Aestyve responsive review</title><style>body{margin:0;background:#dedbd8;font:14px sans-serif}header{padding:12px;display:flex;gap:15px}iframe{border:0;background:white;display:block;height:1050px}output{font-size:12px}label{display:flex;gap:6px}</style></head><body><header><label>Page<select id="page"><option value="../index.html">KO home</option><option value="../en/index.html">EN home</option><option value="../zh/index.html">ZH home</option><option value="../product-revibe.html">Revibe</option><option value="../product-plla.html">PLLA</option></select></label><label>Width<select id="width"><option>390</option><option>320</option><option>760</option><option>1440</option></select></label><output id="status"></output></header><iframe id="review" title="Responsive preview" src="../index.html" style="width:390px"></iframe><script>const f=document.querySelector('iframe'),w=document.querySelector('#width'),p=document.querySelector('#page'),o=document.querySelector('output');w.onchange=()=>{f.style.width=w.value+'px';report()};p.onchange=()=>f.src=p.value;function report(){const d=f.contentDocument;if(d)o.textContent='Viewport '+d.documentElement.clientWidth+' / content '+d.documentElement.scrollWidth}f.onload=()=>{report();setTimeout(report,1800)};</script></body></html>
