<!doctype html><html lang="en"><meta charset="utf-8"><title>Carousel responsive review</title><style>body{margin:0;background:#565569;font:13px sans-serif;color:white}header{padding:14px;background:#27293d;display:flex;gap:15px;position:sticky;top:0;z-index:2}select{padding:6px}iframe{display:block;border:0;width:390px;height:900px;margin:20px auto}</style><header><label>Width <select id="width"><option>390</option><option>320</option><option>1024</option></select></label><label>Page <select id="page"><option value="../index.html#solutions">Korean</option><option value="../en/index.html#solutions">English</option><option value="../zh/index.html#solutions">Chinese</option></select></label><span id="status"></span></header><iframe id="review" title="Page preview" src="../index.html#solutions"></iframe><script>const frame=document.querySelector('#review');function report(){const d=frame.contentDocument;const cards=[...d.querySelectorAll('.ae-product-rail .solution')];document.querySelector('#status').textContent=d.documentElement.clientWidth+' / '+d.documentElement.scrollWidth+' · '+cards.length+' cards'}frame.onload=report;document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value+'px';report()};document.querySelector('#page').onchange=e=>{frame.src=e.target.value};</script></html>
