<!doctype html><html lang="en"><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>Aestyve responsive review</title><style>body{font:14px sans-serif;background:#c5d3de;margin:12px}header{margin:0 0 12px}main{display:flex;gap:12px;align-items:start}article{width:392px}iframe{width:390px;height:790px;border:1px solid #456;border-radius:16px;background:white}label{display:inline-block;margin-right:20px}select{padding:8px}</style><header><label>Page <select id="page"><option value="product-ha.html">HA</option><option value="product-revibe.html">PN</option><option value="product-innofill.html">INNOFill</option><option value="product-plla.html">PLLA</option><option value="product-pcl.html">PCL</option><option value="product-nad.html">NAD</option><option value="product-rvsc.html">RVSC</option><option value="index.html">Home</option></select></label><label>Width <select id="size"><option>390</option><option>320</option><option>768</option></select></label><output id="report"></output></header><main><article>KO<iframe title="Korean preview" id="ko"></iframe></article><article>EN<iframe title="English preview" id="en"></iframe></article><article>ZH<iframe title="Chinese preview" id="zh"></iframe></article></main><script>const p=document.querySelector('#page'),s=document.querySelector('#size'),r=document.querySelector('#report');const frames=[...document.querySelectorAll('iframe')];function load(){r.textContent='';frames.forEach(f=>{f.style.width=s.value+'px';f.parentElement.style.width=(+s.value+2)+'px';f.src='../'+(f.id==='ko'?'':f.id+'/')+p.value;});}frames.forEach(f=>f.onload=()=>{const d=f.contentDocument;if(!d)return;const v=d.documentElement;r.textContent+=f.id+': '+v.clientWidth+'/'+v.scrollWidth+'; ';});p.onchange=load;s.onchange=load;load();</script></html>
