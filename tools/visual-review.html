<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive review</title><style>body{margin:0;background:#656575;font:13px sans-serif;color:white}header{padding:14px;display:flex;gap:15px;position:sticky;top:0;z-index:2;background:#27293d}select{padding:6px}iframe{display:block;border:0;width:390px;height:1100px;margin:20px auto;background:#aaa}</style><header><label>Width <select id="width"><option>390</option><option>320</option><option>760</option><option>1024</option></select></label><label>Page <select id="page"><option value="../product-ha.html">Korean detail</option><option value="../en/product-ha.html">English detail</option><option value="../zh/product-ha.html">Chinese detail</option><option value="../index.html">Home</option></select></label><span id="status"></span></header><iframe title="Page preview" id="review" src="../product-ha.html"></iframe><script>const f=document.querySelector('#review');document.querySelector('#width').onchange=e=>{f.style.width=e.target.value+'px';report()};document.querySelector('#page').onchange=e=>{f.src=e.target.value};function report(){document.querySelector('#status').textContent=f.contentDocument.documentElement.clientWidth+' / '+f.contentDocument.documentElement.scrollWidth}f.onload=report;</script></html>
