<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Aestyve release review</title><style>body{margin:0;background:#57586b;color:white;font:12px system-ui}header{padding:10px;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#27293d;z-index:9;flex-wrap:wrap}button,select{padding:8px}iframe{display:block;margin:16px auto;border:0;width:390px;height:880px;background:white}pre{white-space:pre-wrap;padding:12px}#status{max-width:320px}</style><header><label>Width <select id="width"><option>390</option><option>320</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Page <select id="page"></select></label><button id="top">Top</button><button id="studio">Face Studio</button><button id="bottom">Bottom</button><button id="audit">Audit pages</button><span id="status">Ready</span></header><iframe id="review" title="Responsive page preview"></iframe><pre id="results"></pre><script>
const frame=document.querySelector('#review'),page=document.querySelector('#page'),status=document.querySelector('#status'),results=document.querySelector('#results');
const names=['index','brands','product-ha','product-revibe','product-pcl','product-plla','product-rvsc','company','science','distribution','partnership','contact','product-innofill','product-nad','404'];
const paths=['','en/','zh/'].flatMap(lang=>names.map(n=>lang+n+'.html'));
paths.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;page.append(o)});
function report(){const d=frame.contentDocument;status.textContent=page.value+' · '+d.documentElement.clientWidth+' / '+d.documentElement.scrollWidth;}
function navigate(){frame.src='../'+page.value;}
page.onchange=navigate;frame.onload=report;navigate();
document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value+'px';report()};
document.querySelector('#top').onclick=()=>frame.contentWindow.scrollTo({top:0,behavior:'instant'});
document.querySelector('#bottom').onclick=()=>frame.contentWindow.scrollTo({top:frame.contentDocument.body.scrollHeight,behavior:'instant'});
document.querySelector('#studio').onclick=()=>frame.contentDocument.querySelector('#face-studio')?.scrollIntoView({behavior:'instant'});
document.querySelector('#audit').onclick=async e=>{
 e.target.disabled=true;page.disabled=true;const rows=[];results.textContent='Running…';
 for(const path of paths){
  page.value=path;status.textContent='Checking '+path;
  await new Promise(resolve=>{frame.onload=resolve;frame.src='../'+path});
  const d=frame.contentDocument;d.querySelectorAll('img').forEach(img=>img.loading='eager');
  const timed=await Promise.race([Promise.allSettled([...d.images].map(i=>i.decode()).concat([d.fonts.ready])).then(()=>false),new Promise(resolve=>setTimeout(()=>resolve(true),12000))]);
  await new Promise(resolve=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(resolve)));
  const broken=[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src'));
  const overflow=d.documentElement.scrollWidth-d.documentElement.clientWidth;
  const comments=/<!--\s*EDIT/.test(d.body.innerText), row={path,width:d.documentElement.clientWidth,overflow,broken,comments,pending:timed};
  rows.push(row);results.textContent=JSON.stringify(rows,null,2);
 }
 status.textContent='Complete · '+rows.length+' pages · '+rows.filter(r=>r.overflow>1||r.broken.length||r.comments||r.pending).length+' flagged';
 frame.onload=report;page.disabled=false;e.target.disabled=false;
};
</script></html>
